name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still contains the retired "tools"
          # package, which makes sdkmanager exit 1. Install what we need ourselves.
          packages: ''

      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle buries compile errors under a hundred lines of stack trace; surface them.
      - name: Unit tests (scenarios + core)
        run: |
          set +e
          ./gradlew test > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "----- failed tests -----"
            grep -E "FAILED|expected:|AssertionError|Tests? .* failed" build.log | head -40
            echo "----- compile errors (last, so a log tail shows them) -----"
            grep -E "^e: " build.log | sed 's|file:///home/runner/work/-/-/||' | head -60
          fi
          exit $code

      # The key is deliberately NOT passed here. This APK is published to a public
      # release, and a key compiled into it is readable with `strings`. You paste your
      # key into the app once, on the phone.
      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -n 15 build.log
            grep -E "^e: |error:" build.log | sed 's|file:///home/runner/work/-/-/||' | head -60
          fi
          exit $code

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Last step on purpose: a failing run's log tail then shows exactly what broke.
      - name: What failed
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True)):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      text = (bad.text or bad.get("message") or "").strip().splitlines()
                      head = " | ".join(text[:3])
                      print("FAILED %s.%s :: %s" % (case.get("classname"), case.get("name"), head))
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A direct download link, so the APK can be fetched on the phone without
      # signing in to GitHub (Actions artifacts require a login).
      - name: Publish rolling "latest" release
        if: >
          github.event_name == 'push' &&
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
           github.ref == 'refs/heads/claude/jarvis-voice-android-agent-rhlvqo')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jarvis latest debug build
          body: |
            Debug APK built from `${{ github.sha }}`.
            Download `app-debug.apk` below and follow the README.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
