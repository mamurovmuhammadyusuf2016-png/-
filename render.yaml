# Деплой на Render одной кнопкой (Blueprint).
# Диск обязателен: без него файл SQLite стирается при каждом деплое.
services:
  - type: web
    name: zadarma-call-router
    runtime: node
    plan: starter
    buildCommand: 'echo "Внешних зависимостей нет — сборка не требуется"'
    startCommand: node src/server.js
    healthCheckPath: /health
    disk:
      name: call-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CALL_COOLDOWN_MINUTES
        value: '40'
      - key: AUTOREPLY_MODE
        value: both
      - key: AUTOREPLY_LANGUAGE
        value: ru
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/calls.db
      - key: OWNER_PHONE
        sync: false
      - key: ZADARMA_API_KEY
        sync: false
      - key: ZADARMA_API_SECRET
        sync: false
      - key: AUTOREPLY_VOICE_FILE_ID
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
